name: Agent prompt evals

# Regression gate for the agent's decision logic. Runs the promptfoo suite
# (packages/web-shell/evals) whenever a PR touches the shipping system prompt
# or the eval suite itself, so a future edit to BOARD_AGENT can't silently
# change which tool the agent reaches for.
#
# The suite needs a Gemini key. Set repo secret GEMINI_API_KEY (Settings →
# Secrets and variables → Actions). Until it's set, the job SKIPS gracefully
# instead of red-X'ing every PR — matching the project's fail-open infra rule.

on:
  pull_request:
    paths:
      - 'packages/web-shell/lib/agent/prompts.js'
      - 'packages/web-shell/evals/**'
      - '.github/workflows/agent-evals.yml'
  workflow_dispatch: {}

# A newer push to the same PR cancels the in-flight eval run.
concurrency:
  group: agent-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    name: BOARD_AGENT smoke evals
    runs-on: ubuntu-latest
    # Hard ceiling: promptfoo retries 429s (e.g. depleted Gemini credits) with
    # backoff and would otherwise hang until GitHub's 6h default. Fail fast.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run agent prompt evals
        working-directory: packages/web-shell
        env:
          # Provider reads either name; map the one secret to both.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROMPTFOO_DISABLE_TELEMETRY: '1'
          PROMPTFOO_DISABLE_UPDATE: '1'
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY secret not set — skipping agent prompt evals. Add it in Settings → Secrets and variables → Actions to enable the gate."
            exit 0
          fi
          bun run evals
