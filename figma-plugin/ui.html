<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #2c2c2c;
      color: #fff;
      padding: 16px;
      font-size: 13px;
      line-height: 1.5;
      width: 320px;
      height: 400px;
      overflow-y: auto;
    }

    h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #e5e5e5;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      background: #1e1e1e;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus {
      border-color: #0d99ff;
    }

    input[type="text"]::placeholder {
      color: #666;
    }

    .field {
      margin-bottom: 14px;
    }

    button {
      width: 100%;
      padding: 10px 16px;
      background: #0d99ff;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover {
      background: #0b85e0;
    }

    button:active {
      background: #0a74c4;
    }

    button:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }

    .status {
      margin-top: 16px;
      padding: 10px 12px;
      background: #1e1e1e;
      border-radius: 6px;
      font-size: 12px;
      color: #999;
      min-height: 60px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .status.error {
      color: #ff6b6b;
      border: 1px solid #5c2020;
    }

    .status.success {
      color: #69db7c;
      border: 1px solid #1e4620;
    }

    .status.loading {
      color: #ffd43b;
    }

    .divider {
      height: 1px;
      background: #444;
      margin: 16px 0;
    }

    .section-label {
      font-size: 11px;
      color: #666;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <h2>Repix</h2>

  <div class="field">
    <label>Backend URL</label>
    <input type="text" id="backendUrl" value="http://localhost:3333" placeholder="http://localhost:3333">
  </div>

  <div class="field">
    <label>Capture ID</label>
    <input type="text" id="captureId" placeholder="Enter capture ID or leave empty for latest">
  </div>

  <button id="importBtn">Import Layout</button>

  <div class="divider"></div>

  <div class="section-label">Status</div>
  <div class="status" id="status">Ready. Enter a capture ID and click Import, or leave empty to fetch the latest capture.</div>

  <script>
    const backendUrlInput = document.getElementById('backendUrl');
    const captureIdInput = document.getElementById('captureId');
    const importBtn = document.getElementById('importBtn');
    const statusEl = document.getElementById('status');

    function setStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = 'status';
      if (type) statusEl.classList.add(type);
    }

    importBtn.addEventListener('click', async () => {
      const baseUrl = backendUrlInput.value.trim().replace(/\/+$/, '');
      const captureId = captureIdInput.value.trim();

      if (!baseUrl) {
        setStatus('Please enter a backend URL.', 'error');
        return;
      }

      importBtn.disabled = true;
      setStatus('Fetching capture data...', 'loading');

      try {
        const endpoint = captureId
          ? `${baseUrl}/api/captures/${captureId}`
          : `${baseUrl}/api/captures/latest`;

        const response = await fetch(endpoint);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const captureData = await response.json();

        setStatus('Capture data received. Building Figma layout...', 'loading');

        parent.postMessage({
          pluginMessage: {
            type: 'import-capture',
            data: captureData
          }
        }, '*');

      } catch (err) {
        setStatus(`Error: ${err.message}`, 'error');
        importBtn.disabled = false;
      }
    });

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'build-complete') {
        setStatus(`Layout imported successfully!\n\nCreated ${msg.nodeCount} nodes.\nViewport: ${msg.width}x${msg.height}`, 'success');
        importBtn.disabled = false;
      } else if (msg.type === 'build-error') {
        setStatus(`Build error: ${msg.error}`, 'error');
        importBtn.disabled = false;
      } else if (msg.type === 'build-progress') {
        setStatus(msg.message, 'loading');
      }
    };
  </script>
</body>
</html>
