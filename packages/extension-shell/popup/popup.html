<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-card">
    <header class="popup-header">
      <div class="popup-brand">
        <span class="popup-brand-mark">Un</span><span class="popup-brand-lite">craft</span>
      </div>
      <span class="popup-tagline">Send this tab to your canvas</span>
    </header>

    <section class="popup-section popup-tab-meta">
      <span class="popup-tab-favicon" id="tabFavicon" aria-hidden="true"></span>
      <span class="popup-tab-title" id="tabTitle">Loading…</span>
    </section>

    <!-- Pending-handoff banner: shown when this tab matches an active
         handoff registered by ChallengeModal. Primary action completes
         the pending placeholder instead of creating a new node. -->
    <section class="popup-pending" id="pendingHandoff" hidden>
      <div class="popup-pending-meta">
        <span class="popup-pending-icon" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>
          </svg>
        </span>
        <span class="popup-pending-text">
          Uncraft is waiting on a placeholder for this site
        </span>
      </div>
      <button id="completePendingBtn" type="button" class="popup-btn popup-btn-primary">
        Complete pending capture
      </button>
    </section>

    <section class="popup-section" id="manualSection">
      <label class="popup-label" for="boardSelect">Send to board</label>
      <div class="popup-row">
        <select id="boardSelect" class="popup-select" disabled>
          <option>Loading boards…</option>
        </select>
      </div>
    </section>

    <section class="popup-section popup-actions" id="manualActions">
      <button id="sendBtn" type="button" class="popup-btn popup-btn-primary" disabled>
        Send to Uncraft
      </button>
    </section>

    <section class="popup-status" id="status" hidden></section>

    <footer class="popup-footer">
      <a id="signinLink" href="#" target="_blank" rel="noopener" hidden>
        Sign in to Uncraft →
      </a>
      <a id="openCanvasLink" href="#" target="_blank" rel="noopener" hidden>
        Open canvas →
      </a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
