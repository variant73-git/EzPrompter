# Promptfoo eval config — regression + operator-selection suite for the agent.
#
# Run with:  bun run evals          (regenerates the prompt, then evaluates)
# Stable:    bun run evals -- --repeat 4   (temp-0 isn't fully deterministic)
# Needs:     GEMINI_API_KEY (google), OPENAI_API_KEY (openai), and — to compare
#            the open-weight operators — OPENROUTER_API_KEY (deepseek / kimi).
# (don't call `promptfoo eval` directly — evals/gen-prompt.mjs must run first to
#  regenerate the gitignored prompt file from the shipping BOARD_AGENT.)
#
# Cases live in evals/cases.mjs (a generator: one behaviour → many phrasings, so
# we measure paraphrase robustness, not luck). They assert on ROUTING (which tool,
# on which target) because the generated prompt runs in "evaluation mode" — it asks
# the model to name the tool it would call first (or ASK(...)). NOT end-to-end tests
# of the route/tools — those live in vitest. First-move only; full chains + the
# no-loop/memory behaviour need a multi-turn harness (future).

description: 'Uncraft BOARD_AGENT operator evals — routing + paraphrase robustness'

# Operator candidates, head-to-head on the SAME cases. The agent's operator model
# should be best cost/benefit, not cheapest — pick on measured pass-rate + latency,
# not vibes. temperature 0 → near-deterministic routing so the gate doesn't flake.
providers:
  - id: 'google:gemini-2.5-flash'
    config: { temperature: 0 }
  - id: 'openai:gpt-4o-mini'
    config: { temperature: 0 }
  # ── Open-weight operators via a Western host (data never goes to China). ──
  # Uncomment when OPENROUTER_API_KEY is set. Pin the underlying provider to a
  # Western one (Fireworks/Together/Groq) via `provider.order` so an aggregator
  # doesn't silently route back to the model's origin API.
  # - id: 'openrouter:deepseek/deepseek-chat'
  #   config:
  #     temperature: 0
  #     provider: { order: ['Fireworks', 'Together'], allow_fallbacks: false }
  # - id: 'openrouter:moonshotai/kimi-k2'
  #   config:
  #     temperature: 0
  #     provider: { order: ['Groq', 'Fireworks'], allow_fallbacks: false }   # Groq = lowest latency

# Prompt template is GENERATED from the shipping BOARD_AGENT (lib/agent/prompts.js)
# by evals/gen-prompt.mjs (first step of `bun run evals`). A code-side prompt edit
# flows straight into this suite; the .txt is a derived artifact (gitignored).
prompts:
  - file://./prompts/board-agent.txt

# Cases generated from a compact behaviour spec (one behaviour → many phrasings).
tests: file://./cases.mjs
