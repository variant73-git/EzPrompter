# Promptfoo eval config — smoke tests for the agent's prompt logic.
#
# Run with:  bun run evals          (regenerates the prompt, then evaluates)
# View last: bun run evals:view
# Needs a funded Gemini key in env:  GEMINI_API_KEY=... bun run evals
# (don't call `promptfoo eval` directly — the prompt file is generated first
#  by evals/gen-prompt.mjs and is gitignored, so a raw call sees a stale/absent
#  prompt.)
#
# These tests evaluate the BOARD_AGENT system prompt against representative
# user inputs and assert behavioural properties (mentions the right concept,
# avoids leaking IDs, etc.). They are NOT end-to-end tests of the route or
# tools — those live in vitest. Think of these as "regression tests for the
# prompt itself" so a future edit to BOARD_AGENT doesn't silently break
# common behaviours.
#
# Add new cases to the `tests:` block. Each case has:
#   - vars:  values interpolated into the prompt template
#   - assert: list of assertions (regex / contains / icontains / not-icontains
#             / llm-rubric — see https://promptfoo.dev/docs/configuration/expected-outputs)

description: 'Uncraft BOARD_AGENT smoke evals'

# Cheap default — change to claude/gpt to compare. Keep flash for CI cost.
# Key is read from GOOGLE_API_KEY / GEMINI_API_KEY env by the provider itself —
# don't hardcode `apiKey: $VAR`, promptfoo doesn't interpolate $-refs in that
# field and ends up sending a literal/empty key ("API key not valid").
providers:
  - id: 'google:gemini-2.5-flash'
    config:
      # temperature 0 → near-deterministic routing so the gate doesn't flake
      # on ambiguous inputs (a CI gate that fails 1-in-3 runs is worse than none).
      temperature: 0
  # Second orchestrator candidate — head-to-head on the SAME cases. The agent's
  # operator model should be best-cost/benefit, not cheapest; this lets us pick
  # on measured pass-rate, not vibes. Needs OPENAI_API_KEY in env.
  - id: 'openai:gpt-4o-mini'
    config:
      temperature: 0

# Prompt template is GENERATED from the shipping BOARD_AGENT (lib/agent/prompts.js)
# by evals/gen-prompt.mjs, which runs as the first step of `bun run evals`. That
# means a code-side edit to the system prompt flows straight into this suite —
# the .txt is a derived artifact (gitignored), never hand-edited.
prompts:
  - file://./prompts/board-agent.txt

tests:
  # NOTE: these assert on ROUTING (which tool, on which target) because the
  # generated prompt runs in "evaluation mode" — it asks the model to name the
  # tool it would call. The shipping prompt's voice rule (never name tools to
  # the user) is a PROSE property that can't be tested through this harness; a
  # separate prose-mode prompt would be needed for that (future).

  # ─── 1. Vague "esse node" → deleteNode on the active selection, no question ─
  # Active node is a PROMPT node on purpose: "apaga esse node" is unambiguous
  # (no site to editSite into), so the only correct route is deleteNode. A
  # `section` node here invites the "remove the section via editSite" reading.
  - description: 'Resolves "esse node" to the active selection and routes to deleteNode'
    vars:
      user: '[Active node: prompt "tom de voz" nodeId=p1.]\n\napaga esse node'
    assert:
      - type: icontains
        value: 'deleteNode'        # picked the right tool
      - type: icontains
        value: 'p1'                # targeted the active selection, didn't invent another
      - type: not-icontains
        value: 'qual node'         # didn't ask which one

  # ─── 2. Vague "a outra imagem" → explore/act, don't ask which ──────────────
  - description: 'Resolves "a outra imagem" via exploration instead of asking'
    vars:
      user: '[Active node: image asset "ref" nodeId=abc12345 assetId=A1.]\n\naplica o estilo dessa imagem na outra'
    assert:
      - type: not-icontains
        value: 'qual imagem'       # shouldn't ask which image
      - type: icontains-any
        # takes a tools-first step toward the goal (find the other image, read
        # the board, or proceed with the style transfer) rather than stalling
        value: ['findNearest', 'listBoard', 'viewNode', 'createImage', 'applyDesign']

  # ─── 3. Prompt-as-variable: non-skeleton + active node → prompt node ─
  - description: 'Skeleton edits stay inline; qualitative direction promotes to a prompt node'
    vars:
      user: '[Active node: site "landing" nodeId=def67890.]\n\ndeixa o tom mais playful e a paleta mais quente'
    assert:
      - type: icontains-any
        value: ['createNode', 'prompt node', 'prompt', 'variável']
      - type: not-icontains
        value: 'editSite'  # not a skeleton edit; should NOT go to editSite

  # ─── 4. Skeleton instruction → editSite, not prompt node ───────────
  - description: 'Skeleton edits (add/remove elements) use editSite'
    vars:
      user: '[Active node: site "landing" nodeId=def67890.]\n\nadiciona uma seção de pricing depois do hero'
    assert:
      - type: icontains-any
        value: ['editSite', 'pricing']
      - type: not-icontains
        value: 'createNode'

  # ─── 5. Re-run flow: terminal info given → uses replaceAssetId ─────
  - description: 'Uses replaceAssetId when re-running a workflow terminal in place'
    vars:
      user: '[Active workflow: "img flow" — 3 nodes.]\n[Terminal of this workflow: nodeId=t1 assetId=AX prompt="warmer palette".]\n\nrefaz com o mesmo prompt'
    assert:
      - type: icontains
        value: 'replaceAssetId'
      - type: not-icontains
        value: 'createNode'

  # ═══ NODE-CHAIN ORCHESTRATION — canonical shapes + the type-vocabulary trap ═══
  # These test the OPERATOR's competence: given a request, does it START the
  # right chain with the right node types? They assert on the FIRST move only
  # (the harness is single-shot), which is where most "did it understand" signal
  # lives. Full multi-step sequencing + the no-loop/memory behaviour need the
  # multi-turn harness (future).

  # ─── 6. Style transfer (Site → .md → Site): extract/apply, not editSite ─────
  - description: 'Style transfer routes to extract/apply design, not a raw editSite'
    vars:
      user: '[Board has 2 nodes: "Site A" (site, has result) id=a1; "Site B" (site, has result) id=b1.]\n\ntransfira o estilo do site A pro site B'
    assert:
      - type: icontains-any
        value: ['extractDesign', 'applyDesign']
      - type: not-icontains
        value: 'editSite'

  # ─── 7. Style transfer, colloquial phrasing ─────────────────────────────────
  - description: 'Colloquial style transfer ("a cara do site A") still routes to design pipeline'
    vars:
      user: '[Board has 2 nodes: "Site A" (site, has result) id=a1; "Site B" (site, has result) id=b1.]\n\ndeixa o site B com a cara do site A'
    assert:
      - type: icontains-any
        value: ['extractDesign', 'applyDesign']

  # ─── 8. Type vocabulary: "design system" from a site → design node, NEVER prompt ─
  - description: 'A design-system request extracts a design node, not a prompt node'
    vars:
      user: '[Active node: site "landing" nodeId=s1, has result.]\n\ncrie um design system a partir desse site'
    assert:
      - type: icontains-any
        value: ['extractDesign', 'design-system', 'designmd']
      - type: not-icontains
        value: 'type: "prompt"'

  # ─── 9. Type vocabulary: ".md de design" → design node, not prompt ──────────
  - description: 'A "design .md" request maps to a design-system node, not a prompt'
    vars:
      user: '[Active node: site "loja" nodeId=s2, has result.]\n\ngera o .md de design desse site'
    assert:
      - type: icontains-any
        value: ['extractDesign', 'design-system', 'designmd']
      - type: not-icontains
        value: 'type: "prompt"'

  # ─── 10. Build from an image: take a build step, don't ask ──────────────────
  - description: 'Build-a-site-from-this-image takes a building step, does not stall'
    vars:
      user: '[Active node: image asset "ref" nodeId=i1 assetId=A1.]\n\ncrie um site a partir dessa imagem'
    assert:
      - type: not-icontains
        value: 'ASK'
      - type: icontains-any
        value: ['createNode', 'blank-website', 'runFlow', 'editSite', 'extractDesign', 'applyDesign', 'captureUrl']

  # ─── 11. Qualitative direction → prompt node (variable), not editSite ───────
  - description: 'Qualitative direction promotes to a prompt node, not a skeleton editSite'
    vars:
      user: '[Active node: site "landing" nodeId=l1, has result.]\n\ndeixa a comunicação mais sofisticada e premium'
    assert:
      - type: icontains-any
        value: ['createNode', 'prompt', 'variável']
      - type: not-icontains
        value: 'editSite'

  # ─── 12. Ambiguity (nothing selected, several sites, vague) → ASK ───────────
  - description: 'Vague request with nothing selected + multiple sites → asks which'
    vars:
      user: '[Board has 3 nodes: "Loja" (site, has result) id=x1; "Blog" (site, has result) id=x2; "Portfolio" (site, has result) id=x3.]\n\ndeixa mais escura'
    assert:
      - type: icontains-any
        value: ['ASK', 'qual']

  # ─── 13. New-vs-continue trap (selected site + "create a pricing page") → ASK ─
  - description: 'Build request while a site is selected → asks add-or-new (canonical trap)'
    vars:
      user: '[The user SELECTED this node: site "fintech" nodeId=f1, has result.]\n\ncrie uma página de pricing'
    assert:
      - type: icontains-any
        value: ['ASK', 'adiciona', 'nova', 'separ', 'outro']

  # ─── 14. Selected + referential → ACT, don't ask (the no-loop case) ─────────
  - description: 'Selected node + referential tweak → acts, does not re-ask which'
    vars:
      user: '[The user SELECTED this node: site "landing" nodeId=l1, has result.]\n\ndeixa mais escura'
    assert:
      - type: not-icontains
        value: 'ASK'
      - type: icontains-any
        value: ['editSite', 'createNode', 'updateNode', 'prompt']
